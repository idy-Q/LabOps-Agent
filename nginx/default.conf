# ==============================================================================
# LabOps-Agent 统一反向代理与前端静态托管 Nginx 配置
# 【系统权威配置 / Single Source of Truth】
# 注意：本文件是全系统反向代理、静态托管与 SSE 流式穿透的唯一权威事实来源。
# frontend/nginx.conf 镜像配置必须与本文件保持 100% 精确一致。
# 包含：
# 1. 前端 Vue 3 单页应用 (SPA) 静态资源托管与客户端路由兜底
# 2. ReAct 思考与工具调用 SSE (Server-Sent Events) 流式穿透（关闭缓冲、关闭缓存）
# 3. 后端 RESTful API 统一正向转发
# 4. 规范接口文档直达：/docs 与 /redoc 在 80 端口统一反代
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # 启用 Gzip 压缩，优化大盘与资产台账加载体验
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    # 客户端请求体大小上限限制
    client_max_body_size 20m;

    # --------------------------------------------------------------------------
    # 1. 前端静态单页应用托管 (Vue 3 + Tailwind CSS)
    # --------------------------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 静态资源强缓存优化
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # --------------------------------------------------------------------------
    # 2. SSE 流式穿透核心路由 (/api/chat/stream)
    # 【SSE 关键配置】：必须严格关闭代理缓冲与缓存，保持长连接不被切断
    # --------------------------------------------------------------------------
    location /api/chat/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # 核心防缓冲：禁止 Nginx 对下游响应做 buffer，保障 token 毫秒级直达前端
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # SSE 长连接请求头维护
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 复杂思考链与多步工具执行超时保障（设置 600 秒防意外中断）
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }


    # --------------------------------------------------------------------------
    # 3. 后端通用 RESTful API 路由代理
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --------------------------------------------------------------------------
    # 4. Swagger / OpenAPI 接口文档直达代理
    # 允许在统一 80 端口直接访问后端 OpenAPI 交互规范
    # --------------------------------------------------------------------------
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 5. 常见 HTTP 异常状态码兜底页
    # --------------------------------------------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
