# ==============================================================================
# LabOps-Agent 全栈容器化服务编排 (Docker Compose)
# ==============================================================================

name: labops-agent

services:
  # ----------------------------------------------------------------------------
  # 后端智能运维与调度引擎服务
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labops-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=LabOps-Agent
      - APP_VERSION=1.0.0
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=true
      - AGENT_MOCK_MODE=${AGENT_MOCK_MODE:-auto}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-deepseek-chat}
      - CORS_ORIGINS=*
    volumes:
      # 持久化数据目录：跨容器重启保留 SQLite 实体数据表与 ChromaDB 向量库
      - labops_data:/app/app/data
    networks:
      - labops-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').getcode() == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 前端交互大盘与统一反向代理服务 (Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: labops-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # 挂载 Nginx 规则，支持热更新反向代理与 SSE 穿透参数
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - labops-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

# ------------------------------------------------------------------------------
# 数据持久化卷定义
# ------------------------------------------------------------------------------
volumes:
  labops_data:
    name: labops_data
    driver: local

# ------------------------------------------------------------------------------
# 内部通信桥接网络定义
# ------------------------------------------------------------------------------
networks:
  labops-net:
    name: labops-net
    driver: bridge
